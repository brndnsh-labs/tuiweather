name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify gates
        run: bun run verify

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack and install globally
        run: |
          npm pack --json > /dev/null
          npm install --global ./tuiweather-*.tgz

      - name: Smoke
        run: |
          # Live calls to api.open-meteo.com: retry transient upstream 5xx
          # instead of failing the job on a momentary blip.
          retry() {
            local tries=3 delay=15 i=0
            while [ "$i" -lt "$tries" ]; do
              if "$@"; then return 0; fi
              i=$((i + 1))
              [ "$i" -lt "$tries" ] && sleep "$delay"
            done
            return 1
          }
          VERSION=$(node -p "require('./package.json').version")
          OUTPUT=$(tuiweather --version)
          if [ "$OUTPUT" != "tuiweather $VERSION" ]; then
            echo "::error::unexpected --version output: $OUTPUT"
            exit 1
          fi
          tuiweather --help > /dev/null
          retry tuiweather --one-line --lat 44.98 --lon -93.27
          retry env -u HOME -u XDG_CONFIG_HOME tuiweather --one-line --lat 44.98 --lon -93.27

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Smoke under pre-FFI Node (CLI paths only)
        run: |
          retry() {
            local tries=3 delay=15 i=0
            while [ "$i" -lt "$tries" ]; do
              if "$@"; then return 0; fi
              i=$((i + 1))
              [ "$i" -lt "$tries" ] && sleep "$delay"
            done
            return 1
          }
          node --version
          OUTPUT=$(tuiweather --version)
          if [ "$OUTPUT" != "tuiweather $(node -p "require('./package.json').version")" ]; then
            echo "::error::unexpected --version output under node 24: $OUTPUT"
            exit 1
          fi
          retry tuiweather --one-line --lat 44.98 --lon -93.27
