name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"

      - name: Verify gates
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Build binaries (cross-compile)
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target "bun-${target}" ./src/index.tsx --outfile "release/tuiweather-${target}"
          done

      - name: Package
        run: |
          mkdir -p dist-out release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp "release/tuiweather-${target}" "dist-out/tuiweather"
            tar czf "release/tuiweather-${target}.tar.gz" -C dist-out tuiweather
            shasum -a 256 "release/tuiweather-${target}.tar.gz" > "release/tuiweather-${target}.tar.gz.sha256"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  npm-publish:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bundle
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public
