name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Pin npm release tooling
        run: npm install --global npm@12.0.2

      - name: Install target dependencies
        run: bun install --frozen-lockfile --os '*' --cpu '*'

      - name: Verify release ref
        run: |
          VERSION="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main

      - name: Verify gates
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Build npm bundle
        run: bun run build

      - name: Pack npm artifact
        run: |
          mkdir -p release/npm
          npm pack --ignore-scripts --pack-destination release/npm

      - name: Build standalone binaries
        run: |
          mkdir -p release/raw
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            bun build --compile --target "bun-${target}" ./src/index.tsx --outfile "release/raw/tuiweather-${target}"
          done

      - name: Smoke-test host binary
        run: test "$(release/raw/tuiweather-linux-x64 --version)" = "tuiweather ${GITHUB_REF_NAME#v}"

      - name: Package standalone binaries
        run: |
          mkdir -p release/assets release/package-root
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -m 0755 "release/raw/tuiweather-${target}" release/package-root/tuiweather
            tar czf "release/assets/tuiweather-${target}.tar.gz" -C release/package-root tuiweather
            (
              cd release/assets
              shasum -a 256 "tuiweather-${target}.tar.gz" > "tuiweather-${target}.tar.gz.sha256"
            )
          done
          install -m 0755 "release/raw/tuiweather-windows-x64.exe" release/package-root/tuiweather.exe
          tar czf "release/assets/tuiweather-windows-x64.tar.gz" -C release/package-root tuiweather.exe
          (
            cd release/assets
            shasum -a 256 "tuiweather-windows-x64.tar.gz" > "tuiweather-windows-x64.tar.gz.sha256"
          )

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: release/assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-smoke:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 10
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release

      - name: Smoke-test windows binary
        shell: bash
        run: |
          cd release
          sha256sum -c tuiweather-windows-x64.tar.gz.sha256
          tar -xzf tuiweather-windows-x64.tar.gz
          test "$(./tuiweather.exe --version)" = "tuiweather ${GITHUB_REF_NAME#v}"

  npm-publish:
    runs-on: ubuntu-24.04
    needs: [prepare, windows-smoke]
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/tuiweather
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm release tooling
        run: npm install --global npm@12.0.2

      - name: Download npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm

      - name: Publish to npm
        run: npm publish release/npm/*.tgz --access public

  github-release:
    runs-on: ubuntu-24.04
    needs: npm-publish
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
